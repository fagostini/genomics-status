# Docker Compose configuration for Genomics Status
# 
# This file works for both local Docker Compose usage and VS Code Dev Containers.
# The workspace is mounted to /app by default (can be overridden via CONTAINER_WORKSPACE env var).
#
# Local usage:
#   docker-compose up -d
#
# Dev Container usage:
#   Open folder in VS Code and select "Reopen in Container"
#   The .devcontainer/dev/devcontainer.json references this file
#
# Prerequisites:
#   - StatusDB_NGI repository cloned as a sibling directory (../StatusDB_NGI)

services:
  couchdb:
    # Build from StatusDB_NGI sibling repository
    build:
      context: ../StatusDB_NGI
      dockerfile: Dockerfile
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    volumes:
      - couchdb-data:/opt/couchdb/data
    ports:
      - "5984:5984"
    networks:
      - genomics-status-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  genomics-status:
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes:
      - .:${CONTAINER_WORKSPACE:-/app}:cached
    ports:
      - "9761:9761"
    networks:
      - genomics-status-network
    depends_on:
      couchdb:
        condition: service_healthy
    working_dir: ${CONTAINER_WORKSPACE:-/app}/run_dir
    command: python ../status_app.py --testing_mode --develop 
    environment:
      - CONTAINER_WORKSPACE=${CONTAINER_WORKSPACE:-/app}

  biomate:
    build:
      context: ../BioMate
      dockerfile: Dockerfile
    profiles:
      - biomate
    network_mode: host
    volumes:
      - ./data:/data
      - ./results:/results
      - ./inputs:/inputs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["web-interface", "--host", "127.0.0.1", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  couchdb-data:

networks:
  genomics-status-network:
